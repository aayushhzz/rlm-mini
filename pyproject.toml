[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-mini"
version = "0.1.0"
description = "Minimal Recursive Language Model harness with a Continual Harness (after Prime Agent, arXiv 2608.23552)"
requires-python = ">=3.9"
dependencies = ["jupyter_client>=8", "ipykernel>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rlm = "rlm.cli:main"

[tool.setuptools]
packages = ["rlm"]

[tool.setuptools.package-data]
rlm = ["base_system_prompt.md"]
