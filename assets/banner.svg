<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="rlm-mini — Recursive Language Model Harness with a Continual Harness">
  <defs>
    <linearGradient id="bg-rlm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111e"/>
      <stop offset="55%" stop-color="#171226"/>
      <stop offset="100%" stop-color="#241122"/>
    </linearGradient>
    <linearGradient id="accent-rlm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow-rlm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid-rlm" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a1a1aa" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#bg-rlm)" stroke="#2e1f3d" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="304" rx="22" fill="url(#grid-rlm)"/>
  <ellipse cx="215" cy="160" rx="195" ry="125" fill="url(#glow-rlm)"/>

  <!-- Emblem: Recursive call tree inside a REPL kernel frame -->
  <g transform="translate(92, 68)">
    <rect x="0" y="0" width="184" height="184" rx="28" fill="#1b1429" stroke="#3b2654" stroke-width="2"/>
    <!-- Root node -->
    <circle cx="92" cy="40" r="13" fill="url(#accent-rlm)"/>
    <!-- Branches to depth 1 -->
    <path d="M 82 50 L 52 84" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 102 50 L 132 84" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="48" cy="90" r="10" fill="#271b3d" stroke="#f43f5e" stroke-width="3"/>
    <circle cx="136" cy="90" r="10" fill="#271b3d" stroke="#a855f7" stroke-width="3"/>
    <!-- Branches to depth 2 -->
    <path d="M 43 99 L 34 122" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 53 99 L 66 122" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 131 99 L 118 122" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 141 99 L 150 122" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="126" r="6" fill="#fda4af"/>
    <circle cx="68" cy="126" r="6" fill="#fda4af"/>
    <circle cx="116" cy="126" r="6" fill="#d8b4fe"/>
    <circle cx="152" cy="126" r="6" fill="#d8b4fe"/>

    <!-- Bottom pill -->
    <rect x="28" y="144" width="128" height="22" rx="11" fill="#0f111e" stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="92" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#e9d5ff">rlm() + llm()</text>
  </g>

  <!-- Typography -->
  <g transform="translate(320, 114)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#fafafa">rlm-mini</text>
    <text x="2" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#a1a1aa">Recursive Language Model harness with a versioned Continual Harness</text>

    <!-- Feature pills -->
    <g transform="translate(0, 74)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">
      <rect x="0" y="0" width="176" height="32" rx="16" fill="#2c1322" stroke="#f43f5e" stroke-opacity="0.55"/>
      <text x="88" y="21" text-anchor="middle" fill="#fda4af">Jupyter Kernel</text>

      <rect x="190" y="0" width="194" height="32" rx="16" fill="#231433" stroke="#a855f7" stroke-opacity="0.55"/>
      <text x="287" y="21" text-anchor="middle" fill="#d8b4fe">Refine &amp; Rollback</text>

      <rect x="398" y="0" width="198" height="32" rx="16" fill="#1c1929" stroke="#71717a" stroke-opacity="0.5"/>
      <text x="497" y="21" text-anchor="middle" fill="#d4d4d8">arXiv:2608.23552</text>
    </g>
  </g>

  <!-- Right CLI summary -->
  <g transform="translate(1038, 70)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="0" y="0" fill="#71717a">COMMANDS</text>
    <rect x="0" y="14" width="108" height="22" rx="6" fill="#221630" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="12" y="29" fill="#fda4af">rlm ask</text>
    <rect x="0" y="42" width="108" height="22" rx="6" fill="#221630" stroke="#f43f5e" stroke-opacity="0.5"/>
    <text x="12" y="57" fill="#fda4af">rlm trace</text>
    <rect x="0" y="70" width="108" height="22" rx="6" fill="#221630" stroke="#a855f7" stroke-opacity="0.55"/>
    <text x="12" y="85" fill="#d8b4fe">rlm refine</text>
    <rect x="0" y="98" width="108" height="22" rx="6" fill="#221630" stroke="#a855f7" stroke-opacity="0.55"/>
    <text x="12" y="113" fill="#d8b4fe">rlm rollback</text>
    <rect x="0" y="126" width="108" height="22" rx="6" fill="#221630" stroke="#a855f7" stroke-opacity="0.75"/>
    <text x="12" y="141" fill="#e9d5ff">rlm bench</text>
  </g>
</svg>
